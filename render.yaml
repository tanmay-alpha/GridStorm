# Existing service: srv-dbs8a30ae00c73cs4cog (https://gridstorm-api.onrender.com)
services:
  - type: web
    name: gridstorm-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    # Redeploy only when the image inputs change (mirrors the .dockerignore allow-list). Every
    # redeploy wipes the ephemeral SQLite state, so unrelated commits must not trigger one.
    buildFilter:
      paths:
        - services/api/**
        - services/analytics/**
        - packages/stormspec/**
        - packages/canonical-grid/**
        - workers/pypsa/**
        - database/**
        - data/networks/**
        - data/artifacts/**
        - .dockerignore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GRIDSTORM_EXECUTION_MODE
        value: live
      - key: GRIDSTORM_MAX_CONCURRENT_JOBS
        value: "1"
      - key: GRIDSTORM_LIVE_NETWORKS
        value: ac-dc-meshed,pglib-case14-ieee,pglib-case118-ieee,pypsa-eur-be
      - key: GRIDSTORM_JOB_TIMEOUT_S
        value: "180"
      - key: GRIDSTORM_JOB_MEMORY_MB
        value: "400"
      # Queued+running jobs per signed-in user / anonymous client IP (reuse never counts).
      - key: GRIDSTORM_MAX_ACTIVE_JOBS_PER_CLIENT
        value: "2"
      # Client identity behind Cloudflare -> Render proxies (docs/audit/security-3.0.md): trust
      # Cloudflare's overwritten CF-Connecting-IP; fallback = 2nd X-Forwarded-For entry from the
      # right (never the client-controlled leftmost one).
      - key: GRIDSTORM_TRUST_PROXY
        value: "true"
      - key: GRIDSTORM_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: GRIDSTORM_TRUSTED_PROXY_HOPS
        value: "2"
      - key: GRIDSTORM_CORS_ORIGINS
        value: https://gridstorm.vercel.app,https://gridstorm-tanmay-alphas-projects.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GRIDSTORM_ARTIFACT_STORE
        value: supabase
      - key: GRIDSTORM_SUPABASE_BUCKET
        value: gridstorm-artifacts
      - key: GRIDSTORM_STORAGE_CHECK_TTL_S
        value: "300"
      - key: GRIDSTORM_SUPABASE_STORAGE_TIMEOUT_S
        value: "30"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
