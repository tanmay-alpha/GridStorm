assumptions:
- 'Demand input (CC BY 4.0): Day-ahead forecast of the total load per market time unit, Germany (Reg.
  (EU) 543/2013 Art. 6.1.b), ENTSO-E Transparency Platform (https://transparency.entsoe.eu/), obtained
  via Open Power System Data, Time series 2020-10-06 (https://doi.org/10.25832/time_series/2020-10-06),
  column DE_load_forecast_entsoe_transparency. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
  per the ENTSO-E list of data available for free re-use (2023-10-18), item #1. Changes made by GridStorm:
  the stress day''s 24 hourly values are divided by the mean of the nearest 1 January (UTC), then by the
  scigrid-de network''s normalized hourly load, and rounded to 4 decimals; only these ratios are published.'
- 'Stress-day selection: the date was chosen in OPSD actual load and wind/solar generation and capacity
  (ENTSO-E Reg. 543/2013 Art. 6.1.a and 16.1; OPSD calculations based on BNetzA and netztransparenz.de).
  Those series are not openly licensed; GridStorm stores no value or statistic derived from them except
  the date and the coarse daily renewable multipliers below (data/observed/opsd-de/manifest.json, source.column_reuse).'
- 'Time alignment: network snapshot h = UTC hour h of the stress day. Evidence (data/observed/opsd-de/derived-multipliers.json,
  alignment_evidence): the network''s solar availability matches observed 1 January solar CF far better
  in UTC than shifted to local time; for load the evidence is weaker.'
- 'MODELED demand mapping, applied uniformly to every load: m_h = [F(d,h) / mean_h F(ref,h)] / [L_net(h)
  / mean_h L_net(h)], F = day-ahead load forecast, reference day ref = 2017-01-01 (the 1 January nearest
  to d, i.e. the analogue of the network''s own 1 January profile). The scaled network load follows the
  forecast stress-day shape and its level relative to a 1 January; the actual load differs from the forecast
  by the forecast error. Multipliers rounded to 4 decimals; clipped to (0, 5] at hours [none].'
- 'MODELED renewable shortfall per carrier c (Wind Onshore, Wind Offshore, Solar), applied to every generator
  of c for the whole day: w_c = min(round(mean_h CF_obs,c / mean_h CF_net,c / 0.05) * 0.05, 1), CF_obs
  = national generation / national capacity, CF_net = capacity-weighted p_max_pu of the network''s generators
  of c. The hourly shape stays the network''s own 2011-01-01 shape; the observed hourly profile is deliberately
  not reproduced (not openly licensed). No event when w = 1. Wind Onshore w = 0.05; Wind Offshore w =
  0.15; Solar w = 0.20.'
- 'Aggregate national profiles are applied uniformly to every bus/generator: the spatial pattern of load
  and of wind/solar availability remains the network''s 2011-01-01 pattern; only levels change.'
- The network (2011 grid topology, 2014 renewable capacities, 2011 demand profile) differs from the observed
  year's system; installed capacities are NOT rescaled. This is an analogue stress test, not a reconstruction
  of the observed day.
