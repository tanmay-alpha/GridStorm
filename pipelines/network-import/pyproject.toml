[project]
name = "network-import"
version = "1.0.0"
description = "GridStorm network importers: PyPSA examples and PGLib-OPF MATPOWER cases -> PyPSA NetCDF + canonical-grid/1.0 + dataset-manifest/1.0."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pypsa>=1.4,<1.5",
    "canonical-grid",
    "networkx>=3.2",
    "netcdf4>=1.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
canonical-grid = { path = "../../packages/canonical-grid", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
