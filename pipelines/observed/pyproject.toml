[project]
name = "gridstorm-observed"
version = "0.1.0"
description = "GridStorm observed-data pipelines (OPSD electricity demand/wind/solar, NASA POWER weather) and the historical-analogue StormSpec scenario builder."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pypsa>=1.4,<1.5",
    "netcdf4>=1.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "stormspec[yaml]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
stormspec = { path = "../../packages/stormspec", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_observed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
