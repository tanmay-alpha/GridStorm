[project]
name = "pypsa-eur-be-checks"
version = "0.1.0"
description = "Test env for the PyPSA-Eur Belgium dataset checks (solve_check.py, test_*.py); mirrors the GridStorm core solver stack."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pypsa>=1.4,<1.5",
    "linopy>=0.10,<0.11",
    "highspy>=1.16,<1.17",
    "netcdf4>=1.7",
    "psutil>=5.9",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
