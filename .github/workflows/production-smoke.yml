name: Production smoke (read-only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-and-frontend:
    name: public Vercel + Render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public endpoints without writes
        run: python scripts/probe_production.py
