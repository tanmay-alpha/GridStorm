[project]
name = "stormrisk"
version = "0.1.0"
description = "StormRisk: reproducible Monte Carlo stress studies (EENS, LOLP with uncertainty) over StormSpec scenarios solved by the GridStorm PyPSA adapter."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "psutil>=5.9",
    "stormspec[yaml]",
    "gridstorm-pypsa",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
stormspec = { path = "../stormspec", editable = true }
gridstorm-pypsa = { path = "../../workers/pypsa", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
