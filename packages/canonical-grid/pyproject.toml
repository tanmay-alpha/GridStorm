[project]
name = "canonical-grid"
version = "1.0.0"
description = "GridStorm canonical network (canonical-grid/1.0) and dataset manifest (dataset-manifest/1.0) models."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "ruff>=0.6",
]

[project.scripts]
canonical-grid-export-schema = "canonical_grid.schema_export:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canonical_grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
