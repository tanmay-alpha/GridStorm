[project]
name = "stormml"
version = "0.1.0"
description = "StormML: ML contingency screening trained on simulator-generated (pandapower AC N-1) labels, benchmarked against DC-LODF screening baselines."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    # pandapower 3.5.x AC OPF with apparent-power branch limits (OPF_FLOW_LIM=0) calls the sparse
    # `.H` attribute in pypower/d2Sbr_dV2.py, which SciPy removed in 1.14.
    "scipy>=1.11,<1.18",
    "scikit-learn>=1.5",
    "pandapower>=3.5,<3.6",
    "numba>=0.60",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
