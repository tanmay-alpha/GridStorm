[project]
name = "stormspec"
version = "1.0.0"
description = "StormSpec: typed, engine-agnostic crisis-scenario specification for GridStorm (stormspec/1.0)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
