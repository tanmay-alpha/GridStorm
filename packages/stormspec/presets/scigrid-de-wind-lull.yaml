schema_version: stormspec/1.0
id: scigrid-de-wind-lull
name: SciGRID Germany — wind lull (wind availability x0.3)
description: >-
  Renewable shortfall: onshore and offshore wind availability scaled to 30 % of the dataset
  time series for the whole day (a synthetic stress, not an observed event).
dataset: {network_id: scigrid-de, sha256: 284850c8e922414f9da69ffda0623431148e0c28a3380ba370e4135ac5236500}
horizon: {start: 0, snapshots: 24}
events:
  - {type: renewable_availability_multiplier, carrier: Wind Onshore, value: 0.3, window: null}
  - {type: renewable_availability_multiplier, carrier: Wind Offshore, value: 0.3, window: null}
mitigation:
  storage_dispatch: true
  curtailment: true
  load_shedding: {enabled: true, voll_eur_per_mwh: 10000}
execution:
  engine: pypsa
  formulation: lopf
  solver: highs
  solver_options: {time_limit_s: 300, threads: 1}
  deterministic: true
  seed: 0
assumptions:
  - Synthetic multiplier applied uniformly to every wind generator's p_max_pu series
