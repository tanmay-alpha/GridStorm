[project]
name = "stormbench"
version = "0.1.0"
description = "StormBench: DC sensitivity (PTDF/LODF) contingency screening benchmarked against exact DC and AC N-1 re-solves."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandapower>=3.5,<3.6",
    "psutil>=5.9",
    "numba>=0.60",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running (full AC N-1 on larger cases)",
    "network: requires network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `l` is the conventional symbol for the outaged branch in LODF notation.
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["stormbench"]
