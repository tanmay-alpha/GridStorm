[project]
name = "gridstorm-distribution"
version = "0.1.0"
description = "GridStorm distribution worker: AC time-series power flow of SimBench distribution grids under demand / PV stress (pandapower.timeseries)."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "pandapower>=3.5,<3.6",
    "simbench==1.6.3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "stormspec",
    "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
stormspec = { path = "../../packages/stormspec", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_distribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
