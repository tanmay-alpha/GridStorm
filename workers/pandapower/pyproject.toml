[project]
name = "gridstorm-pandapower"
version = "0.1.0"
description = "GridStorm pandapower worker: AC power flow reference validation, N-1/N-2 contingency screening and the StormSpec pandapower adapter."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "pandapower>=3.5,<3.6",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    # pandapower 3.5.x AC-OPF (pypower/d2Sbr_dV2.py) uses sparse `.H`, removed in SciPy 1.14.
    "scipy>=1.11,<1.18",
    "networkx>=3",
    "stormspec",
    "matpowercaseframes>=2.1,<3",
    "numba>=0.60",
    "pypower>=5.1.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
stormspec = { path = "../../packages/stormspec", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_pandapower"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
