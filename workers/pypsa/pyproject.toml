[project]
name = "gridstorm-pypsa"
version = "0.1.0"
description = "GridStorm PyPSA adapter: StormSpec scenarios -> PyPSA linear optimal power flow (HiGHS) -> gridstorm-result/1.0."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pypsa>=1.4,<1.5",
    "linopy",
    "highspy",
    "netcdf4",
    "psutil>=5.9",
    "stormspec[yaml]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "ruff>=0.6",
]

[tool.uv.sources]
stormspec = { path = "../../packages/stormspec", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_pypsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
