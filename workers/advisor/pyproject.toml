[project]
name = "gridstorm-advisor"
version = "0.1.0"
description = "GridStorm Crisis Response Advisor: deterministic, AC-power-flow-verified remedial action screening (no LLM)."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "pandapower>=3.5,<3.6",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "networkx>=3",
    "numba>=0.60",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gridstorm-advisor = "gridstorm_advisor.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
