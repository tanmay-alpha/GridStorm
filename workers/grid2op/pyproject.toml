[project]
name = "gridstorm-grid2op"
version = "0.1.0"
description = "GridStorm Grid2Op sequential-operation worker (episodes, KPIs, StormSpec mapping)"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "grid2op>=1.12,<1.13",
    "lightsim2grid>=1.3.1,<1.4",
    "pandapower>=3.5,<3.6",
    "pandas<3",
    "numpy",
    "stormspec",
]

[tool.uv.sources]
stormspec = { path = "../../packages/stormspec", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridstorm_grid2op"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs the l2rpn_case14_sandbox dataset (grid2op.make downloads ~294 MB on first use)",
    "slow: takes more than 30 s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
